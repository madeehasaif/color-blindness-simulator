<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Color Blindness Simulator</title>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(to right, #667eea, #764ba2);
    color: white;
    text-align: center;
    margin: 0;
}

h1 {
    margin-top: 20px;
}

.container {
    background: white;
    color: black;
    padding: 20px;
    margin: 20px auto;
    border-radius: 15px;
    width: 90%;
    max-width: 900px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.controls {
    margin-bottom: 15px;
}

input, select, button {
    padding: 10px;
    margin: 5px;
    border-radius: 8px;
    border: none;
}

button {
    background: #667eea;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #5a67d8;
}

.slider-container {
    position: relative;
    width: 100%;
    max-width: 800px;
    margin: auto;
}

canvas {
    width: 100%;
    border-radius: 10px;
}

#outputCanvas {
    position: absolute;
    top: 0;
    left: 0;
    clip-path: inset(0 50% 0 0);
}

.slider {
    width: 100%;
}

</style>
</head>

<body>

<h1>🎨 Color Blindness Simulator</h1>

<div class="container">

<div class="controls">
    <input type="file" id="upload" accept="image/*">

    <select id="type">
        <option value="protanopia">Protanopia (Red Blind)</option>
        <option value="deuteranopia">Deuteranopia (Green Blind)</option>
        <option value="tritanopia">Tritanopia (Blue Blind)</option>
    </select>

    <button onclick="processImage()">Simulate</button>
    <button onclick="downloadImage()">Download</button>
</div>

<div class="slider-container">
    <canvas id="originalCanvas"></canvas>
    <canvas id="outputCanvas"></canvas>
</div>

<input type="range" min="0" max="100" value="50" class="slider" id="slider">

</div>

<script>
let originalCanvas = document.getElementById("originalCanvas");
let outputCanvas = document.getElementById("outputCanvas");

let oCtx = originalCanvas.getContext("2d");
let outCtx = outputCanvas.getContext("2d");

let img = new Image();

document.getElementById("upload").addEventListener("change", function(e) {
    let file = e.target.files[0];
    let reader = new FileReader();

    reader.onload = function(event) {
        img.src = event.target.result;
    };

    reader.readAsDataURL(file);
});

img.onload = function() {
    originalCanvas.width = img.width;
    originalCanvas.height = img.height;
    outputCanvas.width = img.width;
    outputCanvas.height = img.height;

    oCtx.drawImage(img, 0, 0);
};

function processImage() {
    let type = document.getElementById("type").value;

    let imageData = oCtx.getImageData(0, 0, originalCanvas.width, originalCanvas.height);
    let data = imageData.data;

    let matrix;

    if (type === "protanopia") {
        matrix = [
            [0.567, 0.433, 0],
            [0.558, 0.442, 0],
            [0, 0.242, 0.758]
        ];
    } else if (type === "deuteranopia") {
        matrix = [
            [0.625, 0.7, 0],
            [0.7, 0.625, 0],
            [0, 0, 1]
        ];
    } else {
        matrix = [
            [0.95, 0.05, 0],
            [0, 0.433, 0.567],
            [0, 0.475, 0.525]
        ];
    }

    for (let i = 0; i < data.length; i += 4) {
        let r = data[i];
        let g = data[i+1];
        let b = data[i+2];

        let newR = matrix[0][0]*r + matrix[0][1]*g + matrix[0][2]*b;
        let newG = matrix[1][0]*r + matrix[1][1]*g + matrix[1][2]*b;
        let newB = matrix[2][0]*r + matrix[2][1]*g + matrix[2][2]*b;

        data[i] = newR;
        data[i+1] = newG;
        data[i+2] = newB;
    }

    outCtx.putImageData(imageData, 0, 0);
}

document.getElementById("slider").addEventListener("input", function(e) {
    let value = e.target.value;
    outputCanvas.style.clipPath = `inset(0 ${100-value}% 0 0)`;
});

function downloadImage() {
    let link = document.createElement('a');
    link.download = 'colorblind-simulated.png';
    link.href = outputCanvas.toDataURL();
    link.click();
}
</script>

</body>
</html>
